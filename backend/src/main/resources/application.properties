spring.application.name=backend

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bezpieczny_menedzer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Creates and updates tables from JPA entities during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Set JWT_SECRET in the environment before using this outside local development.
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-before-production-please}
app.jwt.expiration-seconds=3600

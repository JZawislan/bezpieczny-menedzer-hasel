services:
  db:
    image: postgres:17-alpine
    container_name: password-manager-db
    environment:
      POSTGRES_DB: bezpieczny_menedzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bezpieczny_menedzer"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: password-manager-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/bezpieczny_menedzer
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: password-manager-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
